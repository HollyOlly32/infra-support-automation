---
- name: Support Engineer Infrastructure Setup
  hosts: support_workstation
  become: true

  vars:
    postgres_version: "15"
    db_container_name: "test_trading_db"
    node_exporter_version: "1.7.0"
    deploy_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    postgres_password: "CHANGE_ME_REQUIRED"
    vpn_server_address: "CHANGE_ME_REQUIRED"

    support_packages:
      - htop
      - curl
      - git
      - net-tools
      - vim
      - netcat-openbsd
      - openvpn
      - ca-certificates
      - apt-transport-https
      - wget
      - gnupg
      - lsb-release

  pre_tasks:
    - name: Check mandatory variables
      fail:
        msg: "Define: postgres_password and vpn_server_address"
      when: postgres_password == "CHANGE_ME_REQUIRED" or vpn_server_address == "CHANGE_ME_REQUIRED"

    - name: Ensure deploy_user exists
      getent:
        database: passwd
        key: "{{ deploy_user }}"
      register: user_info
      
    - name: Fail if deploy_user doesn't exist
      fail:
        msg: "User {{ deploy_user }} does not exist"
      when: not user_info

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      changed_when: false

  tasks:
    - name: 1.1 Install essential support tools
      apt:
        name: "{{ support_packages }}"
        state: present
        update_cache: yes

    - name: 1.2 Ensure system is up to date
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes
      register: upgrade_result
      tags: [patch, upgrade]
      
    - name: 1.3 Reboot if kernel was updated
      reboot:
        msg: "Rebooting after kernel update"
        reboot_timeout: 300
      when: upgrade_result.changed and ansible_connection != 'local'
      tags: [patch, upgrade]
      ignore_errors: yes

    - name: 2.1 Create OpenVPN directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /etc/openvpn
        - /etc/openvpn/client

    - name: 2.2 Create OpenVPN client configuration
      copy:
        content: |
          client
          dev tun
          proto udp
          remote {{ vpn_server_address }} 1194
          resolv-retry infinite
          nobind
          persist-key
          persist-tun
          remote-cert-tls server
          cipher AES-256-CBC
          auth SHA256
          verb 3
        dest: "/etc/openvpn/client/office_vpn.conf"
        mode: '0600'
      notify: restart openvpn

    - name: 3.1 Get user home directory
      set_fact:
        user_home: "{{ ansible_env.HOME }}"

    - name: 3.2 Configure custom aliases
      blockinfile:
        path: "{{ user_home }}/.bashrc"
        block: |
          alias check_app_logs='grep -i "error" /var/log/syslog | tail -20'
          alias watch_logs='tail -f /var/log/syslog'
          alias check_ports='netstat -tulpn | grep LISTEN'
          alias docker_stats='docker stats --no-stream'
          alias psql_trading='docker exec -it {{ db_container_name }} psql -U postgres'
          alias dlogs='docker logs -f'
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        create: yes
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_id }}"
        mode: '0644'

    - name: 4.1 Install Docker
      apt:
        name: [docker.io, python3-pip, python3-setuptools, python3-venv]
        state: present

    - name: 4.2 Install Docker SDK
      pip:
        name: docker
        state: present
        executable: pip3

    - name: 4.3 Ensure Docker is running
      service:
        name: docker
        state: started
        enabled: yes
      ignore_errors: yes

    - name: 4.4 Add user to docker group
      user:
        name: "{{ deploy_user }}"
        groups: docker
        append: yes
      register: docker_group_change
      notify: warn about docker group

    - name: 4.5 Docker group message
      debug:
        msg: "Log out and back in for docker group changes"
      when: docker_group_change.changed

    - name: 4.6 Pull PostgreSQL image
      docker_image:
        name: "postgres:{{ postgres_version }}"
        source: pull
        state: present
      ignore_errors: yes

    - name: 4.7 Create PostgreSQL data directory
      file:
        path: "/opt/postgres_data/{{ db_container_name }}"
        state: directory
        owner: "999"
        group: "999"
        mode: '0755'

    - name: 4.8 Deploy PostgreSQL container
      community.docker.docker_container:
        name: "{{ db_container_name }}"
        image: "postgres:{{ postgres_version }}"
        state: started
        restart_policy: always
        env:
          POSTGRES_PASSWORD: "{{ postgres_password }}"
          POSTGRES_USER: "postgres"
          POSTGRES_DB: "trading_db"
        ports:
          - "5432:5432"
        volumes:
          - "/opt/postgres_data/{{ db_container_name }}:/var/lib/postgresql/data"
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
          interval: 10s
          timeout: 5s
          retries: 5
          start_period: 10s
      ignore_errors: yes

    - name: 5.1 Detect architecture
      set_fact:
        node_arch: "{{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}"

    - name: 5.2 Create node_exporter user
      user:
        name: node_exporter
        system: yes
        shell: /sbin/nologin
        create_home: no

    - name: 5.3 Download Node Exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_arch }}.tar.gz"
        dest: "/tmp/node_exporter.tar.gz"
        timeout: 60
      register: download_result
      until: download_result is success
      retries: 3
      delay: 5

    - name: 5.4 Extract Node Exporter
      unarchive:
        src: "/tmp/node_exporter.tar.gz"
        dest: "/tmp"
        remote_src: yes
        creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_arch }}/node_exporter"

    - name: 5.5 Install Node Exporter binary
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_arch }}/node_exporter"
        dest: "/usr/local/bin/node_exporter"
        mode: '0755'
        remote_src: yes
        owner: node_exporter
        group: node_exporter

    - name: 5.6 Create Node Exporter service
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target

          [Service]
          User=node_exporter
          Group=node_exporter
          ExecStart=/usr/local/bin/node_exporter --web.listen-address=:9100
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        mode: '0644'
      notify: reload node_exporter

    - name: 5.7 Clean up temp files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/node_exporter.tar.gz"
        - "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_arch }}"

    - name: 6.1 Wait for PostgreSQL
      wait_for:
        port: 5432
        host: localhost
        timeout: 30
        state: started
      ignore_errors: yes

    - name: 6.2 Wait for Node Exporter
      wait_for:
        port: 9100
        host: localhost
        timeout: 30
        state: started
      ignore_errors: yes

    - name: 6.3 Display success message
      debug:
        msg: |
          ✅ Setup completed!
          PostgreSQL: localhost:5432
          Node Exporter: http://localhost:9100/metrics

  handlers:
    - name: restart openvpn
      systemd:
        name: "openvpn-client@office_vpn"
        state: restarted
        daemon_reload: yes
        enabled: yes
      ignore_errors: yes
      failed_when: false

    - name: warn about docker group
      debug:
        msg: "Log out and back in to use Docker without sudo"
      changed_when: false

    - name: reload node_exporter
      systemd:
        name: node_exporter
        daemon_reload: yes
        state: restarted
        enabled: yes
      ignore_errors: yes

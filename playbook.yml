---
- name: Support Engineer Infrastructure Setup
  hosts: support_workstation
  become: true

  vars:
    postgres_version: "15"
    db_container_name: "test_trading_db"
    node_exporter_version: "1.7.0"
    deploy_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    postgres_password: "CHANGE_ME_REQUIRED"
    vpn_server_address: "CHANGE_ME_REQUIRED"

    support_packages:
      - htop
      - curl
      - git
      - net-tools
      - vim
      - netcat-openbsd
      - openvpn
      - ca-certificates
      - apt-transport-https
      - wget
      - gnupg
      - lsb-release

  pre_tasks:
    - name: Check mandatory variables
      fail:
        msg: "Define: postgres_password and vpn_server_address"
      when: postgres_password == "CHANGE_ME_REQUIRED" or vpn_server_address == "CHANGE_ME_REQUIRED"

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      changed_when: false

  tasks:
    - name: 1.1 Install essential support tools
      apt:
        name: "{{ support_packages }}"
        state: present
        update_cache: yes

    # OpenVPN Configuration
    - name: 2.1 Create OpenVPN directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /etc/openvpn
        - /etc/openvpn/client

    - name: 2.2 Create OpenVPN client configuration
      copy:
        content: |
          client
          dev tun
          proto udp
          remote {{ vpn_server_address }} 1194
          resolv-retry infinite
          nobind
          persist-key
          persist-tun
          remote-cert-tls server
          cipher AES-256-CBC
          auth SHA256
          verb 3
        dest: "/etc/openvpn/client/office_vpn.conf"
        mode: '0600'
      notify: restart openvpn

    # Bash Aliases
    - name: 3.1 Configure custom aliases
      blockinfile:
        path: "{{ ansible_env.HOME }}/.bashrc"
        block: |
          alias check_app_logs='grep -i "error" /var/log/syslog | tail -20'
          alias watch_logs='tail -f /var/log/syslog'
          alias check_ports='netstat -tulpn | grep LISTEN'
          alias docker_stats='docker stats --no-stream'
          alias psql_trading='docker exec -it test_trading_db psql -U postgres'
          alias dlogs='docker logs -f'
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        create: yes
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_id }}"
        mode: '0644'

    # Docker and PostgreSQL
    - name: 4.1 Install Docker
      apt:
        name: [docker.io, python3-pip]
        state: present

    - name: 4.2 Install Docker SDK
      pip:
        name: docker
        state: present
        executable: pip3

    - name: 4.3 Pull PostgreSQL image
      docker_image:
        name: "postgres:{{ postgres_version }}"
        source: pull
        state: present

    - name: 4.4 Remove existing container if present
      docker_container:
        name: "{{ db_container_name }}"
        state: absent
      ignore_errors: yes

    - name: 4.5 Create PostgreSQL container
      docker_container:
        name: "{{ db_container_name }}"
        image: "postgres:{{ postgres_version }}"
        state: started
        restart_policy: always
        env:
          POSTGRES_PASSWORD: "{{ postgres_password }}"
          POSTGRES_USER: "postgres"
          POSTGRES_DB: "trading_db"
      ignore_errors: yes

    # Node Exporter
    - name: 5.1 Download Node Exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: "/tmp/node_exporter.tar.gz"
      ignore_errors: yes

    - name: 5.2 Extract Node Exporter
      unarchive:
        src: "/tmp/node_exporter.tar.gz"
        dest: "/tmp"
        remote_src: yes
      ignore_errors: yes

    - name: 5.3 Install Node Exporter binary
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: "/usr/local/bin/node_exporter"
        mode: '0755'
        remote_src: yes
      ignore_errors: yes

    - name: 5.4 Run Node Exporter
      shell: nohup /usr/local/bin/node_exporter --web.listen-address=:9100 &
      ignore_errors: yes

    # Validation (all with ignore_errors for Codespaces)
    - name: 6.1 Check PostgreSQL
      command: docker exec test_trading_db pg_isready -U postgres
      ignore_errors: yes
      register: pg_check

    - name: 6.2 Check Node Exporter
      uri:
        url: http://localhost:9100/metrics
        method: GET
        status_code: 200
      ignore_errors: yes
      register: ne_check

    - name: 6.3 Display success message
      debug:
        msg: |
          ✅ Setup completed!

          PostgreSQL: docker exec -it test_trading_db psql -U postgres
          Node Exporter: http://localhost:9100/metrics

          ⚠️ If PostgreSQL didn't start, run manually:
          docker rm -f test_trading_db
          docker run -d --name test_trading_db -e POSTGRES_PASSWORD={{ postgres_password }} -e POSTGRES_USER=postgres -e POSTGRES_DB=trading_db postgres:15

  handlers:
    - name: restart openvpn
      systemd:
        name: "openvpn-client@office_vpn"
        state: restarted
        daemon_reload: yes
        enabled: yes
      ignore_errors: yes
      failed_when: false

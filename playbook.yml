---
- name: Support Engineer Infrastructure Setup
  hosts: support_workstation
  become: true

  vars:
    # Software versions and settings
    postgres_version: "15"
    db_container_name: "test_trading_db"
    node_exporter_version: "1.7.0"

    # Essential packages for support engineer
    support_packages:
      - htop
      - curl
      - git
      - net-tools
      - vim
      - netcat-openbsd   # ИЗМЕНЕНО: telnet заменён на netcat (не передаёт данные в открытом виде)
      - openvpn

  tasks:
    - name: 1.1 Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: 1.2 Install essential support tools
      apt:
        name: "{{ item }}"
        state: present
      loop: "{{ support_packages }}"

    - name: 1.3 Ensure system is at the latest patch level
      apt:
        upgrade: dist
        autoremove: yes
      # ВНИМАНИЕ: dist-upgrade может обновить ядро. Запускайте осознанно,
      # либо добавьте тег: tags: [patch] и запускайте через --tags patch

    - name: 2.1 Create placeholder for VPN configuration
      copy:
        content: |
          client
          dev tun
          proto udp
          remote vpn.trading-infra.example 1194
          resolv-retry infinite
          nobind
          persist-key
          persist-tun
          verb 3
        dest: "/etc/openvpn/client/office_vpn.conf"
        owner: root
        group: root
        mode: '0600'
      # ВНИМАНИЕ: адрес vpn.trading-infra.example — placeholder.
      # Замените на реальный адрес VPN-сервера перед запуском.

    - name: 3.1 Configure custom alias for log analysis
      # ИЗМЕНЕНО: ansible_user_id при become:true возвращает root.
      # Используем отдельную переменную deploy_user, которую нужно передать при запуске:
      #   ansible-playbook playbook.yml -e "deploy_user=youruser"
      lineinfile:
        path: "/home/{{ deploy_user }}/.bashrc"
        line: "alias check_app_logs='grep -i \"error\" /var/log/syslog'"
        regexp: '^alias check_app_logs='
        state: present
        create: yes

    - name: 4.1 Ensure Docker is installed
      apt:
        name: docker.io
        state: present

    - name: 4.2 Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: 4.3 Deploy PostgreSQL container for local testing
      community.docker.docker_container:
        name: "{{ db_container_name }}"
        image: "postgres:{{ postgres_version }}"
        state: started
        restart_policy: always
        env:
          # ИСПРАВЛЕНО: пароль вынесен в переменную.
          # Задайте через ansible-vault или передайте при запуске:
          #   ansible-playbook playbook.yml -e "postgres_password=ВашПароль"
          # Либо создайте vault-файл: ansible-vault create vault.yml
          POSTGRES_PASSWORD: "{{ postgres_password }}"
        published_ports:
          - "5432:5432"

    - name: 5.1 Set architecture map
      set_fact:
        node_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' or ansible_architecture == 'arm64' else 'amd64' }}"
    
    - name: 5.2 Install Node Exporter for monitoring metrics
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_arch }}.tar.gz"
        dest: "/tmp/node_exporter.tar.gz"

    - name: 5.3 Extract Node Exporter binary
      unarchive:
        src: "/tmp/node_exporter.tar.gz"
        dest: "/tmp"
        remote_src: yes

    - name: 5.4 Move binary to system path
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_arch }}/node_exporter"
        dest: "/usr/local/bin/node_exporter"
        mode: '0755'
        remote_src: yes

    - name: 5.5 Create Node Exporter systemd service
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target

          [Service]
          User=nobody
          ExecStart=/usr/local/bin/node_exporter
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: '0644'
        
    - name: 5.5.1 Reload systemd daemon
      systemd:
      daemon_reload: yes
      
    - name: 5.6 Enable and start Node Exporter service
      service:
        name: node_exporter
        state: started
        enabled: yes

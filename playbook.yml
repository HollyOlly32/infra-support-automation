---
- name: Support Engineer Infrastructure Setup
  hosts: support_workstation
  become: true

  vars:
    # Software versions and settings
    postgres_version: "15"
    db_container_name: "test_trading_db"
    node_exporter_version: "1.7.0"
    
    # User configuration - автоматически определяет реального пользователя
    deploy_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    
    # Database password (обязательно переопределить при запуске)
    postgres_password: "CHANGE_ME_REQUIRED"
    
    # VPN real server address (обязательно переопределить)
    vpn_server_address: "CHANGE_ME_REQUIRED"

    # Essential packages for support engineer
    support_packages:
      - htop
      - curl
      - git
      - net-tools
      - vim
      - netcat-openbsd
      - openvpn
      - ca-certificates
      - apt-transport-https
      - wget
      - gnupg
      - lsb-release

  pre_tasks:
    - name: Check mandatory variables are defined
      fail:
        msg: |
          Please define required variables:
          - postgres_password: -e "postgres_password=YourPassword"
          - vpn_server_address: -e "vpn_server_address=your.vpn.server.com"
      when: 
        - postgres_password == "CHANGE_ME_REQUIRED" or vpn_server_address == "CHANGE_ME_REQUIRED"

    - name: Ensure deploy_user exists and has a home directory
      getent:
        database: passwd
        key: "{{ deploy_user }}"
      register: user_info
      
    - name: Fail if deploy_user doesn't exist
      fail:
        msg: "User {{ deploy_user }} does not exist on the system"
      when: not user_info

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      changed_when: false

  tasks:
    # Section 1: System Basics
    - name: 1.1 Install essential support tools
      apt:
        name: "{{ support_packages }}"
        state: present
        update_cache: yes

    - name: 1.2 Ensure system is up to date (optional - use with caution)
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes
      register: upgrade_result
      tags: [patch, upgrade]
      
    - name: 1.3 Reboot if kernel was updated
      reboot:
        msg: "Rebooting after kernel update"
        reboot_timeout: 300
      when: upgrade_result.changed
      tags: [patch, upgrade]

    # Section 2: VPN Configuration
    - name: 2.1 Create OpenVPN directories
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /etc/openvpn
        - /etc/openvpn/client

    - name: 2.2 Create OpenVPN client configuration
      copy:
        content: |
          client
          dev tun
          proto udp
          remote {{ vpn_server_address }} 1194
          resolv-retry infinite
          nobind
          persist-key
          persist-tun
          remote-cert-tls server
          cipher AES-256-CBC
          auth SHA256
          verb 3
          # Add your certificates here or reference external files
          # ca /etc/openvpn/client/ca.crt
          # cert /etc/openvpn/client/client.crt
          # key /etc/openvpn/client/client.key
        dest: "/etc/openvpn/client/office_vpn.conf"
        owner: root
        group: root
        mode: '0600'
      notify: restart openvpn

    # Section 3: Bash Aliases for Support Engineer
    - name: 3.1 Get user home directory
      set_fact:
        user_home: "{{ ansible_env.HOME }}"

    - name: 3.2 Configure custom aliases for log analysis
      blockinfile:
        path: "{{ user_home }}/.bashrc"
        block: |
          # Custom aliases for Support Engineer
          alias check_app_logs='grep -i "error" /var/log/syslog | tail -20'
          alias watch_logs='tail -f /var/log/syslog'
          alias check_ports='netstat -tulpn | grep LISTEN'
          alias docker_stats='docker stats --no-stream'
          alias psql_trading='docker exec -it {{ db_container_name }} psql -U postgres'
          alias dlogs='docker logs -f'
        marker: "# {mark} ANSIBLE MANAGED BLOCK - Support Engineer Aliases"
        create: yes
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_id }}"
        mode: '0644'

    # Section 4: Docker and PostgreSQL
    - name: 4.1 Install Docker dependencies
      apt:
        name:
          - docker.io
          - python3-pip
          - python3-setuptools
          - python3-venv
        state: present

    - name: 4.2 Install Docker SDK for Python
      pip:
        name: docker
        state: present
        executable: pip3

    - name: 4.3 Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: 4.4 Add deploy_user to docker group
      user:
        name: "{{ deploy_user }}"
        groups: docker
        append: yes
      register: docker_group_change
      notify: warn about docker group

    - name: 4.5 Display docker group message if changed
      debug:
        msg: |
          ⚠️ User {{ deploy_user }} was added to docker group.
          Please log out and log back in (or run 'newgrp docker') for changes to take effect.
      when: docker_group_change.changed

    - name: 4.6 Pull PostgreSQL Docker image
      docker_image:
        name: "postgres:{{ postgres_version }}"
        source: pull
        state: present

    - name: 4.7 Create PostgreSQL data directory on host
      file:
        path: "/opt/postgres_data/{{ db_container_name }}"
        state: directory
        owner: "999"
        group: "999"
        mode: '0755'

    - name: 4.8 Deploy PostgreSQL container for local testing
      community.docker.docker_container:
        name: "{{ db_container_name }}"
        image: "postgres:{{ postgres_version }}"
        state: started
        restart_policy: always
        env:
          POSTGRES_PASSWORD: "{{ postgres_password }}"
          POSTGRES_USER: "postgres"
          POSTGRES_DB: "trading_db"
        ports:
          - "5432:5432"
        volumes:
          - "/opt/postgres_data/{{ db_container_name }}:/var/lib/postgresql/data"
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
          interval: 10s
          timeout: 5s
          retries: 5
          start_period: 10s

    # Section 5: Prometheus Node Exporter
    - name: 5.1 Detect system architecture
      set_fact:
        node_arch: "{{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}"

    - name: 5.2 Create node_exporter user
      user:
        name: node_exporter
        system: yes
        shell: /sbin/nologin
        create_home: no

    - name: 5.3 Download Node Exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_arch }}.tar.gz"
        dest: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_arch }}.tar.gz"
        mode: '0644'
        timeout: 60
        validate_certs: yes
      register: download_result
      until: download_result is success
      retries: 3
      delay: 5

    - name: 5.4 Extract Node Exporter
      unarchive:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_arch }}.tar.gz"
        dest: "/tmp"
        remote_src: yes
        creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_arch }}/node_exporter"

    - name: 5.5 Install Node Exporter binary
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_arch }}/node_exporter"
        dest: "/usr/local/bin/node_exporter"
        mode: '0755'
        remote_src: yes
        owner: node_exporter
        group: node_exporter

    - name: 5.6 Create Node Exporter systemd service
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          Documentation=https://prometheus.io/docs/guides/node-exporter/
          After=network.target

          [Service]
          User=node_exporter
          Group=node_exporter
          ExecStart=/usr/local/bin/node_exporter \
            --web.listen-address=:9100 \
            --collector.disable-defaults \
            --collector.cpu \
            --collector.meminfo \
            --collector.diskstats \
            --collector.filesystem \
            --collector.netdev \
            --collector.loadavg \
            --collector.uptime
          ExecReload=/bin/kill -HUP $MAINPID
          Restart=on-failure
          RestartSec=5
          TimeoutStopSec=20
          ProtectSystem=full
          ProtectHome=yes
          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: '0644'
      notify: reload node_exporter

    - name: 5.7 Clean up temporary files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_arch }}.tar.gz"
        - "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_arch }}"

    # Section 6: Validation
    - name: 6.1 Wait for PostgreSQL to be ready
      wait_for:
        port: 5432
        host: localhost
        timeout: 30
        state: started

    - name: 6.2 Wait for Node Exporter to start
      wait_for:
        port: 9100
        host: localhost
        timeout: 30
        state: started

    - name: 6.3 Test Node Exporter metrics endpoint
      uri:
        url: http://localhost:9100/metrics
        method: GET
        status_code: 200
        timeout: 5
      register: node_exporter_test
      retries: 3
      delay: 5

    - name: 6.4 Display success message
      debug:
        msg: |
          ✅ Infrastructure setup completed successfully!
          
          📊 Services running:
          - PostgreSQL: localhost:5432 (user: postgres, db: trading_db)
          - Node Exporter: http://localhost:9100/metrics
          
          🔧 Useful commands:
          - Check PostgreSQL logs: docker logs {{ db_container_name }}
          - Connect to DB: docker exec -it {{ db_container_name }} psql -U postgres
          - View aliases: source ~/.bashrc && alias
          - Check VPN status: sudo systemctl status openvpn-client@office_vpn
          - Check Node Exporter: curl http://localhost:9100/metrics
          
          💡 Next steps:
          1. Add your OpenVPN certificates to /etc/openvpn/client/
          2. Start VPN: sudo systemctl start openvpn-client@office_vpn
          3. Set up Prometheus server to scrape Node Exporter metrics

  handlers:
    - name: restart openvpn
      systemd:
        name: "openvpn-client@office_vpn"
        state: restarted
        daemon_reload: yes
        enabled: yes
      ignore_errors: yes
      failed_when: false

    - name: warn about docker group
      debug:
        msg: "User {{ deploy_user }} added to docker group - log out and back in to use Docker without sudo"
      listen: "warn about docker group"
      changed_when: false

    - name: reload node_exporter
      systemd:
        name: node_exporter
        daemon_reload: yes
        state: restarted
        enabled: yes
